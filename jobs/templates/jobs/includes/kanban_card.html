<div class="kanban-card" id="app-card-{{ app.id }}">
    <div class="d-flex justify-content-between align-items-start mb-2">
        <strong class="text-white d-block text-truncate" style="max-width: 140px;" title="{{ app.candidate.full_name }}">{{ app.candidate.full_name }}</strong>
        <span class="badge-status status-badge-element status-{% if app.status == 'Applied' %}applied{% elif app.status == 'Under Review' %}review{% elif app.status == 'Shortlisted' %}shortlist{% else %}rejected{% endif %}">{{ app.status }}</span>
    </div>
    
    <span class="text-primary small d-block mb-2 text-truncate" title="{{ app.job_posting.title }}">{{ app.job_posting.title }}</span>
    
    <div class="d-flex flex-wrap gap-1 mb-3">
        {% for skill in app.candidate.get_skills_list|slice:":3" %}
        <span class="badge badge-glass-tag" style="font-size: 0.65rem; padding: 2px 6px;">{{ skill }}</span>
        {% empty %}
        <span class="text-muted small" style="font-size: 0.65rem;">No skills listed</span>
        {% endfor %}
    </div>
    
    <!-- Card Action Buttons -->
    <div class="d-flex justify-content-between align-items-center border-top border-secondary-subtle pt-2">
        <button class="btn btn-outline-light py-1 px-2 font-weight-bold rounded-pill glass-btn" 
                style="font-size: 0.7rem; padding: 2px 8px;"
                data-bs-toggle="modal" data-bs-target="#candidateModal"
                data-name="{{ app.candidate.full_name }}"
                data-email="{{ app.candidate.email }}"
                data-phone="{{ app.candidate.phone }}"
                data-skills="{{ app.candidate.skills }}"
                data-resume="{{ app.candidate.resume_url|default:'' }}"
                data-portfolio="{{ app.candidate.portfolio_url|default:'' }}"
                data-bio="{{ app.candidate.bio|default:'' }}"
                data-cover="{{ app.cover_letter }}"
                data-applied="{{ app.applied_at|date:'M d, Y' }}"
                data-job="{{ app.job_posting.title }}">
            <i class="bi bi-person-lines-fill me-1"></i> Profile
        </button>
        
        <div class="dropdown">
            <button class="btn dropdown-toggle py-1 px-2 rounded-pill dropdown-status-btn" 
                    style="font-size: 0.7rem; padding: 2px 8px;" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                Stage
            </button>
            <ul class="dropdown-menu dropdown-menu-end dropdown-menu-glass">
                <li><a class="dropdown-item dropdown-item-glass pipeline-status-option" href="#" data-status="Applied" data-app-id="{{ app.id }}">Applied</a></li>
                <li><a class="dropdown-item dropdown-item-glass pipeline-status-option" href="#" data-status="Under Review" data-app-id="{{ app.id }}">Under Review</a></li>
                <li><a class="dropdown-item dropdown-item-glass pipeline-status-option" href="#" data-status="Shortlisted" data-app-id="{{ app.id }}">Shortlist</a></li>
                <li><a class="dropdown-item dropdown-item-glass pipeline-status-option" href="#" data-status="Rejected" data-app-id="{{ app.id }}">Reject</a></li>
            </ul>
        </div>
    </div>
</div>
